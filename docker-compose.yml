services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: canadianai
      POSTGRES_PASSWORD: canadianai
      POSTGRES_DB: canadianai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
