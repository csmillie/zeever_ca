services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: zeever
      POSTGRES_PASSWORD: zeever
      POSTGRES_DB: zeever
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
