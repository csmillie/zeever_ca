name: Claude Code Review

on:
  pull_request:
    types: [opened, reopened]
    paths-ignore:
      - '*.md'
      - '*.lock'
      - 'pnpm-lock.yaml'
      - 'uv.lock'
      - '.gitignore'
      - '*.png'
      - '*.jpg'
      - '*.ico'
      - '*.svg'
      - 'docs/**'
  issue_comment:
    types: [created]

jobs:
  # Auto-review on PR open/reopen (Sonnet for speed and cost)
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get diff and write prompt
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff $PR_NUMBER > /tmp/pr-diff.txt
          gh pr view $PR_NUMBER --json title,body --jq '"Title: " + .title + "\n\nDescription:\n" + .body' > /tmp/pr-info.txt
          gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments --jq '.[].body' > /tmp/existing-comments.txt 2>/dev/null || true

          cat > /tmp/review-prompt.txt << 'PROMPT_END'
          You are reviewing a pull request. The diff and PR info are provided below.
          Do NOT read any files from the repository. Only review the diff provided.

          RULES:
          - Only flag real bugs, security issues, or logic errors
          - Do not flag style, formatting, or naming nitpicks
          - Do not flag issues that a linter or type checker would catch
          - Do not flag pre-existing issues (only review changed lines)
          - Lead with questions, use "we" not "you"
          - If the PR is clean with no issues, approve it with a brief summary
          - Check the existing comments below and do not re-raise resolved issues

          EXISTING COMMENTS:
          PROMPT_END

          cat /tmp/existing-comments.txt >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          echo "PR INFO:" >> /tmp/review-prompt.txt
          cat /tmp/pr-info.txt >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          echo "DIFF:" >> /tmp/review-prompt.txt
          cat /tmp/pr-diff.txt >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          cat >> /tmp/review-prompt.txt << INSTRUCTIONS_END
          POST YOUR REVIEW:
          1. Get commit SHA: git rev-parse HEAD
          2. Post inline comments for issues: gh api repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments -f body="comment" -f path="file/path" -F line=42 -f commit_id="SHA" -f side=RIGHT
          3. Submit verdict:
             - If clean: gh pr review ${PR_NUMBER} --approve --body "Summary"
             - If issues: gh pr review ${PR_NUMBER} --request-changes --body "Summary"
          INSTRUCTIONS_END

      - name: Review PR
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat /tmp/review-prompt.txt)
          claude -p "$PROMPT" --model claude-sonnet-4-20250514 --max-turns 10 --allowedTools "Bash(gh:*)"

  # On-demand review via @claude mention (Opus for full power)
  mention-review:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get context and build prompt
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          gh pr diff $PR_NUMBER > /tmp/pr-diff.txt
          gh pr view $PR_NUMBER --json title,body --jq '"Title: " + .title + "\n\nDescription:\n" + .body' > /tmp/pr-info.txt
          gh api repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/comments --jq '.[].body' > /tmp/existing-comments.txt 2>/dev/null || true

          cat > /tmp/review-prompt.txt << 'PROMPT_END'
          You are reviewing a pull request. A team member mentioned you with a specific request.
          The diff, PR info, and their comment are provided below.
          Do NOT read any files from the repository. Only review the diff provided.

          RULES:
          - Address the specific request in the @claude comment
          - Only flag real bugs, security issues, or logic errors
          - Do not flag style, formatting, or naming nitpicks
          - Do not flag issues that a linter or type checker would catch
          - Do not flag pre-existing issues (only review changed lines)
          - Lead with questions, use "we" not "you"
          - If the PR is clean with no issues, approve it with a brief summary
          - Check the existing comments below and do not re-raise resolved issues

          EXISTING COMMENTS:
          PROMPT_END

          cat /tmp/existing-comments.txt >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          echo "@claude REQUEST:" >> /tmp/review-prompt.txt
          echo "$COMMENT_BODY" >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          echo "PR INFO:" >> /tmp/review-prompt.txt
          cat /tmp/pr-info.txt >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          echo "DIFF:" >> /tmp/review-prompt.txt
          cat /tmp/pr-diff.txt >> /tmp/review-prompt.txt

          echo "" >> /tmp/review-prompt.txt
          cat >> /tmp/review-prompt.txt << INSTRUCTIONS_END
          POST YOUR REVIEW:
          1. Get commit SHA: git rev-parse HEAD
          2. Post inline comments for issues: gh api repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/comments -f body="comment" -f path="file/path" -F line=42 -f commit_id="SHA" -f side=RIGHT
          3. Submit verdict:
             - If clean: gh pr review ${PR_NUMBER} --approve --body "Summary"
             - If issues: gh pr review ${PR_NUMBER} --request-changes --body "Summary"
          INSTRUCTIONS_END

      - name: Review PR (Opus)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PROMPT=$(cat /tmp/review-prompt.txt)
          claude -p "$PROMPT" --model claude-opus-4-20250514 --max-turns 5 --allowedTools "Bash(gh:*)"
