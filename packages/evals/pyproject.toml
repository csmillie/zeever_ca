[project]
name = "canadian-ai-evals"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "canadian-ai-shared",
    "canadian-ai-query-engine",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
