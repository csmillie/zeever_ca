[project]
name = "canadian-ai-query-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "langfuse>=3.0",
    "canadian-ai-shared",
    "canadian-ai-llm-router",
    "canadian-ai-indexer",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/query_engine"]
