[project]
name = "canadian-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "canadian-ai-shared",
    "canadian-ai-llm-router",
    "canadian-ai-crawler",
    "canadian-ai-parser",
    "canadian-ai-indexer",
    "canadian-ai-query-engine",
    "canadian-ai-evals",
    "canadian-ai-graphrag",
    "slowapi>=0.1.9",
    "python-dateutil>=2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.uv.sources]
canadian-ai-shared = { workspace = true }
canadian-ai-llm-router = { workspace = true }
canadian-ai-crawler = { workspace = true }
canadian-ai-parser = { workspace = true }
canadian-ai-indexer = { workspace = true }
canadian-ai-query-engine = { workspace = true }
canadian-ai-evals = { workspace = true }
canadian-ai-graphrag = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/crawler",
    "packages/parser",
    "packages/indexer",
    "packages/query-engine",
    "packages/graphrag",
    "packages/evals",
    "packages/llm-router",
    "packages/shared",
]

[tool.pytest.ini_options]
testpaths = ["packages"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
